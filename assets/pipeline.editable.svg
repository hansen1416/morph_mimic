<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable version for offline/online SVG editors: CSS custom properties replaced with
     their hardcoded light-theme values from style.css, so it renders correctly standalone.
     This is not the file used on the page: assets/pipeline.svg, and the copy inlined in
     index.html, stay theme-aware via CSS custom properties. After editing this file, port
     layout and content changes back into those two by hand, or send the edited file back
     and ask for the merge, rather than replacing them outright, or dark mode support
     will be lost. -->
<svg viewBox="0 0 820 1065" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="pm-arrowhead"/>
    </marker>
  </defs>

  <style>
    .pm-stage-bg { fill: #f6f7f9; stroke: #e2e4e8; stroke-width: 1; }
    .pm-stage-title { fill: #2b5fd9; font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
    .pm-box { fill: #ffffff; stroke: #e2e4e8; stroke-width: 1.3; }
    .pm-box-accent { fill: #eef2fd; stroke: #2b5fd9; stroke-width: 1.3; }
    .pm-label { fill: #1a1a1a; font-size: 13px; text-anchor: middle; }
    .pm-sublabel { fill: #5a5f66; font-size: 11px; text-anchor: middle; }
    .pm-arrowhead { fill: #5a5f66; }
    .pm-edge { stroke: #5a5f66; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .pm-edge-accent { stroke: #2b5fd9; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .pm-edge-dashed { stroke: #2b5fd9; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    .pm-caption { fill: #5a5f66; font-size: 11px; text-anchor: middle; font-style: italic; }
  </style>

  <!-- ================= STAGE 1 ================= -->
  <rect x="10" y="10" width="800" height="372" rx="10" class="pm-stage-bg"/>
  <text x="30" y="34" class="pm-stage-title">Stage 1 &#8212; Data &amp; Asset Construction (offline, once)</text>

  <!-- Motion path -->
  <rect x="50" y="55" width="230" height="52" rx="8" class="pm-box"/>
  <text x="165" y="76" class="pm-label">AMASS / HumanML3D</text>
  <text x="165" y="93" class="pm-sublabel">source clip</text>

  <path d="M165,107 L165,133" class="pm-edge"/>

  <rect x="50" y="135" width="230" height="52" rx="8" class="pm-box-accent"/>
  <text x="165" y="156" class="pm-label">HUMOS</text>
  <text x="165" y="173" class="pm-sublabel">conditioned on b = (g, &#946;)</text>

  <path d="M165,187 L165,213" class="pm-edge"/>

  <rect x="50" y="215" width="230" height="52" rx="8" class="pm-box"/>
  <text x="165" y="236" class="pm-label">Shape-specific</text>
  <text x="165" y="253" class="pm-sublabel">reference motion</text>

  <!-- Body path -->
  <rect x="540" y="55" width="230" height="52" rx="8" class="pm-box"/>
  <text x="655" y="76" class="pm-label">SMPL params</text>
  <text x="655" y="93" class="pm-sublabel">same b = (g, &#946;)</text>

  <path d="M655,107 L655,133" class="pm-edge"/>

  <rect x="540" y="135" width="230" height="52" rx="8" class="pm-box-accent"/>
  <text x="655" y="156" class="pm-label">SMPLSim</text>
  <text x="655" y="173" class="pm-sublabel">generates MJCF asset</text>

  <path d="M655,187 L655,213" class="pm-edge"/>

  <rect x="540" y="215" width="230" height="52" rx="8" class="pm-box"/>
  <text x="655" y="233" class="pm-label">Matching MJCF asset</text>
  <text x="655" y="249" class="pm-sublabel">skeleton, collision,</text>
  <text x="655" y="263" class="pm-sublabel">mass / inertia</text>

  <!-- Converge -->
  <path d="M165,267 L165,282 L350,282 L350,312" class="pm-edge"/>
  <path d="M655,267 L655,282 L470,282 L470,312" class="pm-edge"/>
  <rect x="260" y="312" width="300" height="52" rx="8" class="pm-box-accent"/>
  <text x="410" y="333" class="pm-label">Refined, paired corpus</text>
  <text x="410" y="350" class="pm-sublabel">20,951 clips &#215; 128 shapes, each matched to its own asset</text>

  <!-- Connector between stages -->
  <path d="M410,364 L410,378" class="pm-edge-accent"/>

  <!-- ================= STAGE 2 ================= -->
  <rect x="10" y="385" width="800" height="668" rx="10" class="pm-stage-bg"/>
  <text x="30" y="409" class="pm-stage-title">Stage 2 &#8212; RL Training Loop</text>

  <rect x="290" y="425" width="240" height="48" rx="8" class="pm-box-accent"/>
  <text x="410" y="445" class="pm-label">Body shape b</text>
  <text x="410" y="461" class="pm-sublabel">fixed for this env's lifetime</text>

  <path d="M410,473 L410,498" class="pm-edge"/>

  <!-- two branches: reference sampling and PD scaling -->
  <path d="M410,498 L200,498 L200,518" class="pm-edge"/>
  <path d="M410,498 L620,498 L620,518" class="pm-edge"/>

  <rect x="80" y="520" width="240" height="52" rx="8" class="pm-box"/>
  <text x="200" y="541" class="pm-label">Reference sampled</text>
  <text x="200" y="558" class="pm-sublabel">only from b's own variants</text>

  <rect x="500" y="520" width="240" height="52" rx="8" class="pm-box"/>
  <text x="620" y="541" class="pm-label">PD gains scaled</text>
  <text x="620" y="558" class="pm-sublabel">per-joint by b's mass ratio</text>

  <path d="M200,572 L200,590 L360,590 L360,617" class="pm-edge"/>
  <path d="M620,572 L620,590 L460,590 L460,617" class="pm-edge"/>

  <rect x="270" y="617" width="280" height="46" rx="8" class="pm-box-accent"/>
  <text x="410" y="645" class="pm-label">Simulate one control step</text>

  <path d="M410,663 L410,688" class="pm-edge"/>

  <rect x="200" y="690" width="420" height="66" rx="8" class="pm-box"/>
  <text x="410" y="711" class="pm-label">Observation</text>
  <text x="410" y="728" class="pm-sublabel">current state + 7 history + 4 future reference slots</text>
  <text x="410" y="744" class="pm-sublabel">+ morphology [g, &#946;] and previous action (bypass attention)</text>

  <path d="M410,756 L410,781" class="pm-edge"/>

  <rect x="250" y="783" width="320" height="48" rx="8" class="pm-box-accent"/>
  <text x="410" y="804" class="pm-label">Policy &#960;(a | o, b)</text>
  <text x="410" y="820" class="pm-sublabel">shared parameters across all 128 shapes</text>

  <path d="M410,831 L410,856" class="pm-edge"/>

  <rect x="290" y="858" width="240" height="52" rx="8" class="pm-box"/>
  <text x="410" y="879" class="pm-label">Reward</text>
  <text x="410" y="896" class="pm-sublabel">tracking error vs. b's own reference</text>

  <path d="M410,910 L410,935" class="pm-edge"/>

  <rect x="270" y="937" width="280" height="48" rx="8" class="pm-box-accent"/>
  <text x="410" y="958" class="pm-label">PPO update</text>
  <text x="410" y="974" class="pm-sublabel">shared actor + critic, all shapes at once</text>

  <!-- feedback: parameter update closes the loop back into the policy -->
  <path d="M270,961 C 90,961 90,807 250,807" class="pm-edge-dashed"/>

  <text x="410" y="1020" class="pm-caption">Same shared policy and reward formula for every shape &#8212; only the matched reference, asset, and PD gains change per environment.</text>
  <text x="410" y="1038" class="pm-caption">Solid arrows: per-step data flow. Dashed arrow: parameter update, shared across all 128 shapes.</text>
</svg>
